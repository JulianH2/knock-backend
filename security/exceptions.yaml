# Registro de excepciones de seguridad y calidad (constitución §8). Lo valida scripts/ci/check_exceptions.py.
# Reglas: máximo 90 días, responsable con nombre, evidencia en la justificación, plan de remediación.
# En el código, la supresión cita el ID en la misma línea:  // nosemgrep: knock-random-inseguro -- EXC-001
#
# Campos: id · herramienta · regla · alcance (rutas) · justificacion · responsable · creada (AAAA-MM-DD) · vence · plan
#
# Ejemplo (no activo):
#  - id: EXC-001
#    herramienta: semgrep
#    regla: knock-random-inseguro
#    alcance: tests/perf/data_builder.cs
#    justificacion: generador de datos ficticios para k6; no protege nada (evidencia en PR #123)
#    responsable: Ángel Alexis Blas Castillo
#    creada: 2026-10-20
#    vence: 2026-12-04
#    plan: reemplazar por Bogus en TT-QA-02
excepciones:
  - id: EXC-001
    herramienta: semgrep
    regla: python.lang.security.audit.dangerous-subprocess-use-tainted-env-args.dangerous-subprocess-use-tainted-env-args
    alcance: scripts/hooks/knock_guard.py
    justificacion: >-
      Falso positivo. La llamada usa una lista de argumentos (sin shell, no hay interpolación de comandos) y los
      nombres que recibe `--similar` salen de expresiones regulares de identificadores (`[A-Za-z]\w+`) que no
      pueden empezar con «-»; además se limitan a 8. Evidencia: revisión de scripts/hooks/knock_guard.py (función
      check_new_file) en el PR de KNOCK-26 y primera ejecución de Semgrep en el CI de ese PR.
    responsable: José Julián Hernández Hernández
    creada: 2026-10-14
    vence: 2027-01-12
    plan: validar los nombres con `re.fullmatch` antes de llamar o importar `codemap` en lugar de lanzar un subproceso, y retirar la excepción antes de vencer.
  - id: EXC-002
    herramienta: checkov
    regla: CKV_DOCKER_2
    alcance: src/Knock.Api/Dockerfile
    justificacion: >-
      El Dockerfile no define HEALTHCHECK. La API se despliega en Azure Container Apps, que define sus sondas
      (liveness y readiness sobre /health y /health/ready) fuera de la imagen, por lo que la instrucción no se usaría;
      además la imagen base aspnet no incluye curl ni wget. Evidencia: TC-TT-API-01-15 (PR #17), donde /health y
      /health/ready responden 200 en el contenedor, y el primer análisis de Checkov en el CI de ese PR.
    responsable: José Julián Hernández Hernández
    creada: 2026-10-15
    vence: 2027-01-13
    plan: definir las sondas en el Bicep de Container Apps (TT-AZ-02) y retirar la excepción; si se despliega sin sondas externas, agregar una herramienta de sondeo a la imagen.
  - id: EXC-003
    herramienta: dockle
    regla: CIS-DI-0010
    alcance: knock-api (imagen construida desde src/Knock.Api/Dockerfile); workflow ci-pr.yml, paso de Dockle (accept-key)
    justificacion: >-
      Falso positivo. Dockle marca como «credenciales» variables de la imagen base de Microsoft y del propio
      Dockerfile (DOTNET_VERSION, ASPNET_VERSION, ASPNETCORE_URLS, ASPNETCORE_ENVIRONMENT, ASPNETCORE_HTTP_PORTS, DOTNET_RUNNING_IN_CONTAINER, DOTNET_EnableDiagnostics, APP_UID, la etiqueta org.opencontainers.image.version y los argumentos --gid y --uid del `groupadd` de la imagen base);
      sus valores son versiones, puertos, el nombre del entorno, indicadores booleanos y un identificador de usuario, no secretos. Solo se aceptan esas claves
      con nombre: la regla sigue activa para cualquier otra variable o archivo. Evidencia: salida de Dockle en el CI del PR #17.
    responsable: José Julián Hernández Hernández
    creada: 2026-10-15
    vence: 2027-01-13
    plan: revisar con cada cambio de la imagen base y retirar las claves aceptadas que ya no aparezcan.
