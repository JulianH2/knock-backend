name: ai-review

# Revisión opcional con Claude Code usando los MISMOS agentes revisores del repositorio
# (security-reviewer y traceability-clerk). No sustituye a la revisión humana ni a los checks,
# y NO forma parte del check requerido `gate`.
# Se activa solo cuando existen la variable AI_REVIEW=true y el secreto ANTHROPIC_API_KEY.
# Si falta cualquiera de los dos (o el PR viene de un fork, donde GitHub no entrega secretos),
# el job `review` se SALTA (skipped): no falla ni deja el PR en rojo.
# Cómo activarlo: CONTRIBUTING.md, sección «Revisión con IA en el CI (opcional)».

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  check:
    name: ¿Revisión con IA habilitada?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.k.outputs.enabled }}
    steps:
      - id: k
        env:
          AI_REVIEW: ${{ vars.AI_REVIEW }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$AI_REVIEW" = "true" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Revisión con IA omitida: falta la variable AI_REVIEW=true o el secreto ANTHROPIC_API_KEY."
          fi

  review:
    needs: check
    if: needs.check.outputs.enabled == 'true' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revisa el PR #${{ github.event.pull_request.number }} de ${{ github.repository }} contra ${{ github.base_ref }}.
            1. Actúa como el agente definido en .claude/agents/security-reviewer.md y entrega su tabla PASS/FAIL.
            2. Actúa como .claude/agents/traceability-clerk.md para la spec del issue (clave KNOCK-N del título).
            No edites archivos. Publica un solo comentario en el PR con ambas tablas y el veredicto.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(git diff *),Bash(git log *),Bash(python3 scripts/sdd_lint.py *),Bash(python3 scripts/codemap.py *),Bash(gh pr comment *)"
